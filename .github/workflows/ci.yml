name: CI - Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore TaskFlow.Api/TaskFlow.Api.csproj

    - name: Build
      run: dotnet build TaskFlow.Api/TaskFlow.Api.csproj --no-restore

    - name: Run tests
      run: dotnet test TaskFlow.Tests/TaskFlow.Tests.csproj --no-build --verbosity normal